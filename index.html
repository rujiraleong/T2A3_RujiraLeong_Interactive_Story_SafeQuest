<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SafeQuest</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

 <!-- ✅ GLOBAL BGM (do NOT put inside #game-container) -->
  <audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>

  <link rel="preload" href="./captain-hook-cursor-64.png" as="image">
  <link rel="preload" href="./captain-hook-cursor-active-64.png" as="image">

  <div id="game-container">
  <!-- Trust Meter stays at top -->
  <div id="trust-bar">
    <span>Safety Score</span>
    <div class="meter">
      <div class="fill" id="trust-fill"></div>
    </div>
    <span class="label" id="trust-label">UNKNOWN</span>
  </div>

  <!-- ✅ Map Background Video (sits behind map image + trust bar) -->
  <video id="map-bg-video" autoplay muted loop playsinline></video>

  <!-- Intro Screen -->
  <div id="intro-screen" class="screen active">
  <video id="intro-video" autoplay muted loop playsinline></video>

  <div id="intro-content">
    <h1 id="typewriter"></h1>
    <p class="intro-paragraph">
    <span class="intro-line-one">Learn how to stay safe online through interactive choices.</span><br>
    <span class="intro-line-two">Every choice you make affects your safety.</span>
    </p>
    <p class="happy-playing">Happy playing!</p>
    <button id="start-btn">Start Game</button>
  </div>
</div>

<!-- NPC Explainer Screen -->
<div id="npc-screen" class="screen">
  <video id="npc-video" autoplay muted loop playsinline></video>

  <div id="npc-ui">
    <img id="npc-image" src="pirate-npc.png" alt="Pirate NPC">

    <div id="npc-box">
      <p id="npc-speaker">Captain Byte:</p>
      <p id="npc-text"></p>

      <button id="npc-next-btn">Next</button>
    </div>
  </div>
</div>

  <!-- Image placeholder (optional, can be dynamic via JS) -->
  <div id="intro-image" class="screen-image" style="display:none; text-align:center;">
  <img src="intdes map.png" alt="Scenario Map" style="max-width:100%; border:2px solid #fff; border-radius:8px;">
  </div>

<!-- Q1 Screen -->
<div id="q1-screen" class="screen">

  <!-- Chat background video -->
  <video id="chat-bg-video" autoplay muted loop playsinline></video>

  <!-- ✅ Overlay MUST be a sibling, not inside <video> -->
  <div id="chat-video-overlay"></div>

  <div class="chat-area">
    <div class="chat-container"></div>
  </div>

  <div class="choices">
    <button id="q1-risky">Reply casually</button>
    <button id="q1-safe">Ignore / check profile</button>
  </div>

</div>

  <!-- Treasure Flip Cards -->
<div class="flip-card-back">
  <h3>Online Grooming</h3>
  <ul class="takeaways">
    <li>Never share personal details online</li>
    <li>Trust your instincts—stop if it feels off</li>
    <li>Report and block suspicious users</li>
  </ul>
  <button class="claim-coin-btn">Claim Coin</button>
</div>
  
</div>

  </div>

  <script src="script.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/js/imageMapResizer.min.js"></script>

  <audio
  id="bgm"
  src="pirate-ship-354089.mp3"
  loop
  preload="auto">
  </audio>

</body>
</html>
